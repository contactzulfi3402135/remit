services:
  # One authoritative ledger process. In production this role belongs to
  # the customer's ERP/billing API; here it is the seeded stand-in world.
  - type: web
    name: remit-ledger
    runtime: docker
    plan: free
    dockerfilePath: ./ledger/Dockerfile
    dockerContext: ./ledger
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: LEDGER_TOKEN
        generateValue: true
      - key: WORLD_SEED
        value: "20261023"

  # Password-protected Control Room. Set LEDGER_URL to the public
  # remit-ledger URL and copy its LEDGER_TOKEN after the first deploy.
  - type: web
    name: remit-review
    runtime: docker
    plan: free
    dockerfilePath: ./deploy/Dockerfile.agent
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: LEDGER_URL
        sync: false
      - key: LEDGER_TOKEN
        sync: false
      - key: REVIEW_PASSWORD
        generateValue: true
      # The Control Room database settings are the source of truth for the
      # model and per-sweep budget. Keep these one-run CLI overrides blank.
      - key: DRAFT_MODEL
        value: ""
      - key: REMIT_BUDGET_USD
        value: ""
      # Optional provider keys for the dashboard's "Run one day now". The
      # scheduled GitHub sweep needs the same provider key as a GitHub secret.
      - key: XAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OSS_BASE_URL
        value: https://api.groq.com/openai/v1
