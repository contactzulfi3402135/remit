services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: remit
      POSTGRES_PASSWORD: remit
      POSTGRES_DB: remit
    ports:
      - "5432:5432"
    volumes:
      - remit-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U remit -d remit"]
      interval: 5s
      timeout: 3s
      retries: 10

  ledger:
    build: ./ledger
    environment:
      DATABASE_URL: postgres://remit:remit@db:5432/remit?sslmode=disable
      LEDGER_TOKEN: ${LEDGER_TOKEN:-change-me}
      WORLD_SEED: ${WORLD_SEED:-20261023}
      PORT: "8090"
    ports:
      - "8090:8090"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8090/healthz >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 10

  agent:
    build:
      context: .
      dockerfile: deploy/Dockerfile.agent
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://remit:remit@db:5432/remit
      LEDGER_URL: http://ledger:8090
      LEDGER_TOKEN: ${LEDGER_TOKEN:-change-me}
      REVIEW_PASSWORD: ${REVIEW_PASSWORD:-change-me}
      DRAFT_MODEL: ${DRAFT_MODEL:-baseline:rules}
      REMIT_BUDGET_USD: ${REMIT_BUDGET_USD:-1}
      XAI_API_KEY: ${XAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OSS_BASE_URL: ${OSS_BASE_URL:-https://api.groq.com/openai/v1}
      PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      ledger:
        condition: service_started

volumes:
  remit-db:
