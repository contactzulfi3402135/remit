name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version-file: ledger/go.mod
      - run: npm install
      - run: npm run check
      - run: npm test
      - name: Ledger
        working-directory: ledger
        run: |
          go vet ./...
          go test ./...
